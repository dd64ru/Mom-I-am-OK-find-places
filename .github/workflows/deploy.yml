name: Deploy production
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: places-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: bash scripts/check-secrets.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run deploy:package -- --output .deploy/functions
      - name: Write validated non-secret function settings
        env:
          WORKSPACE_ID: ${{ vars.WORKSPACE_ID }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT }}
          OPENAI_HOST_ID: ${{ vars.OPENAI_HOST_ID }}
          NOMINATIM_ENDPOINT: ${{ vars.NOMINATIM_ENDPOINT }}
        run: node scripts/write-function-env.mjs
      # Authentication happens after checks and public-source packaging; no secret payload reads.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: mom-im-ok-places
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - run: npx --no-install firebase deploy --project mom-im-ok-places --only functions:places:placesWebhook --non-interactive
